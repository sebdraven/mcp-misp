name: ci

on:
  push:
    branches: [main]
  pull_request:
  # Weekly, because zizmor gains rules after the last push and a workflow that
  # was clean in March is not clean by definition in September. The publish job
  # is gated on a push to main, so a scheduled run audits and builds without
  # ever touching the registry.
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

# Least privilege by default; jobs that need more ask for it explicitly.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: '1.27'
  # Pin the JavaScript action runtime. The actions pinned below already run on
  # node24; this stops a laggard from silently dropping a job back to node20.
  ACTIONS_RUNNER_FORCE_ACTIONS_NODE_VERSION: node24

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l ./cmd ./internal)
          if [ -n "$unformatted" ]; then
            echo "not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - run: go vet ./...

      # No network. Every test runs against an httptest stub: this server talks
      # to other people's MISP instances, and CI must never be one of the
      # clients hitting them.
      - run: go test -race -coverprofile=coverage.out ./...

      - name: coverage summary
        run: go tool cover -func=coverage.out | tail -n 1 >> "$GITHUB_STEP_SUMMARY"

  staticcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: dominikh/staticcheck-action@9716614d4101e79b4340dd97b10e54d68234e431 # v1.4.1
        with:
          version: latest
          install-go: false

  zizmor:
    # Static analysis of these very workflows. A CI pipeline is an execution
    # environment with a token and a package registry attached, so it gets the
    # same scrutiny as the code it builds — including the SHA pinning,
    # persist-credentials and permissions rules, which are checked here rather
    # than by hand.
    #
    # Blocking: no continue-on-error, and findings fail the job.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      # Elevated on this job only, for the SARIF upload to code scanning.
      # Public repositories get code scanning without Advanced Security; if this
      # repository is ever made private, set advanced-security to false or this
      # job fails on the upload rather than on a real finding.
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          advanced-security: true
          persona: regular
          min-severity: low
          min-confidence: low

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: build the binary
        run: go build -trimpath -o bin/mcp-misp ./cmd/mcp-misp

      - name: version reports itself
        run: ./bin/mcp-misp -version

      - name: a missing instance is a startup failure, not a silent default
        # The server holds an API key for somebody else's MISP. Starting with
        # neither URL nor key and waiting to fail on the first tool call would
        # be the wrong shape of error.
        run: |
          set -euo pipefail
          if ./bin/mcp-misp -transport stdio </dev/null; then
            echo "expected a non-zero exit with no MISP_URL" >&2
            exit 1
          fi

      - name: docker build
        run: docker build -t mcp-misp:ci .

      - name: smoke test the image
        run: docker run --rm --entrypoint /usr/local/bin/mcp-misp mcp-misp:ci -version

  publish:
    # Every push to main, which includes every merged pull request — they are
    # the same event. Deliberately NOT on pull_request: a PR from a fork must
    # never be able to write to the registry.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, staticcheck, zizmor, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          # No moving tags from main. edge and the commit sha are traceable to
          # a commit; latest belongs to a release.
          flavor: latest=false
          tags: |
            type=raw,value=edge
            type=sha

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=edge
            COMMIT=${{ github.sha }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true
